[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qchem-leak-screen"
version = "0.1.0"
description = "Perimeter physical-sanity filter for AI-predicted quantum-chemical properties"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Sordo Martínez", email = "amurlaniakea@gmail.com" }]
keywords = ["cheminformatics", "quantum-chemistry", "sanity-check", "hallucination", "property-prediction"]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
# Test-only deps: jsonschema se usa para validar el SARIF 2.1.0 en tests (gate CI).
# NO es dependencia de runtime: el CLI no valida el schema al emitir (DECISIÓN 3).
testing = [
    "pytest>=8",
    "pytest-cov>=5",
    "jsonschema>=4",
]

[project.urls]
Homepage = "https://github.com/amurlaniakea/qchem-leak-screen"
Repository = "https://github.com/amurlaniakea/qchem-leak-screen"

[project.scripts]
qls = "qchem_leak_screen.cli:main"

[tool.setuptools]
package-dir = { "" = "." }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests that are statistically expensive (run with -m slow)",
]

[tool.coverage.run]
source = ["qchem_leak_screen"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
